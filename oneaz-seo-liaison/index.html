<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<script>
  /* Served from a sub-path such as /pod-work with no trailing slash, every relative
     asset would resolve against the site root and 404. Adding the slash fixes it.
     This can only ever fire once — the redirected URL already ends in a slash. */
  (function () {
    var p = location.pathname;
    if (!/\/$/.test(p) && !/\.[a-z0-9]+$/i.test(p)) {
      location.replace(p + '/' + location.search + location.hash);
    }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
